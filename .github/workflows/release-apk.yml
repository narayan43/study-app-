name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.3)'
        required: false
        default: 'v1.0.3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android commandline tools
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Ensure .env exists for Secrets plugin
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine version name and code
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${{ github.ref_name }}"
          fi
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ]; then
            RAW_TAG="v1.0.3"
          fi
          CLEAN_VER="${RAW_TAG#v}"
          
          # Compute monotonic versionCode > 102
          PATCH=$(echo "$CLEAN_VER" | cut -d'.' -f3)
          CODE=$(( 100 + 10#$PATCH ))
          if [ "$CODE" -le 102 ]; then
            CODE=103
          fi
          
          echo "version_name=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Calculated version: $CLEAN_VER (code: $CODE)"

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PappVersionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PappVersionName=${{ steps.version.outputs.version_name }} \
            --stacktrace

      - name: Verify APK is signed
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Build output not found at $APK_FILE"
            exit 1
          fi
          echo "Verifying signature of $APK_FILE with apksigner..."
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify --verbose "$APK_FILE"

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/ExamPrep-${{ steps.version.outputs.version_name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ExamPrep ${{ steps.version.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/ExamPrep-${{ steps.version.outputs.version_name }}.apk
            release-assets/app-debug.apk
          body: |
            ## ExamPrep CSV v${{ steps.version.outputs.version_name }}

            ### Highlights
            - **Open Reel Actions:** Added "Import questions.csv" and "Add single question" directly from the active reel.
            - **Open Note Actions:** Added "Import questions.csv" and "Add single question" directly from the active note reader.
            - **Question Bank Tree Columns:** Form fields dynamically pull distinct values from `questions.csv` without autofilling from reel/note.
            - **Selective Overwrite:** Unfilled columns keep imported CSV values; filled columns force override.
            - **Automatic Linking:** Links new questions to the active reel (`links/video_questions.csv`) or active note (`links/note_questions.csv`) without touching reel/note rows or existing links.
            - **In-Place Update:** Compatible with previous installations (same keystore & package name: `com.aistudio.upsiprep.kxmpzq`).
