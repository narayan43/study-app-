name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android commandline tools
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Ensure .env exists for Secrets plugin
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Compute Release Versions
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VERSION="${TAG#v}"
          V_CODE=$(( 100 + GITHUB_RUN_NUMBER ))
          echo "version_name=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$V_CODE" >> "$GITHUB_OUTPUT"
          echo "ACTUAL_VERSION_CODE=$V_CODE" >> "$GITHUB_ENV"
          echo "ACTUAL_VERSION_NAME=$CLEAN_VERSION" >> "$GITHUB_ENV"

      - name: Set up Release Signing Key
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore decoded from secrets.KEYSTORE_BASE64"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/release.keystore"
            echo "KEYSTORE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          elif [ -f release.keystore ]; then
            echo "Using release.keystore found in workspace"
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "⚠️ No release keystore secret found. Set KEYSTORE_BASE64 in GitHub Secrets for stable signed release updates."
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: |
          echo "Building ExamPrep CSV with versionCode=$ACTUAL_VERSION_CODE, versionName=$ACTUAL_VERSION_NAME"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            ./gradlew assembleRelease -PversionCode=$ACTUAL_VERSION_CODE -PversionName=$ACTUAL_VERSION_NAME --stacktrace
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew assembleDebug -PversionCode=$ACTUAL_VERSION_CODE -PversionName=$ACTUAL_VERSION_NAME --stacktrace
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi

          ASSET_NAME="ExamPrepCSV-v${ACTUAL_VERSION_NAME}.apk"
          cp "$APK_SRC" "$ASSET_NAME"
          echo "RELEASE_APK=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          name: ExamPrep CSV ${{ github.ref_name }} (Build ${{ env.ACTUAL_VERSION_CODE }})
          files: ${{ env.RELEASE_APK }}
          body: |
            ## ExamPrep CSV ${{ github.ref_name }}

            - **Version Name:** `${{ env.ACTUAL_VERSION_NAME }}`
            - **Version Code:** `${{ env.ACTUAL_VERSION_CODE }}`
            - **Application ID:** `com.aistudio.upsiprep.kxmpzq`

            ### 🔄 In-Place Update Instructions
            - **Do NOT uninstall the previous version!**
            - Download `${{ env.RELEASE_APK }}` and install it directly over your existing app.
            - All your local CSV files, notes, HTML documents, attempts history, and reels are completely preserved.
          draft: false
          prerelease: false
