name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK Asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "ExamPrep-${TAG_NAME}.apk"

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          name: ExamPrep ${{ github.ref_name }}
          files: ExamPrep-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
