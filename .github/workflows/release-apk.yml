name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure ANDROID_HOME and accept licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Install Android Platform and Build Tools
        run: |
          echo "y" | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Ensure .env exists for Secrets plugin
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Prepare Release APK Asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "ExamPrep-${TAG_NAME}.apk"

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          name: ExamPrep ${{ github.ref_name }}
          files: ExamPrep-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
