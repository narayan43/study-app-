name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android commandline tools
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Ensure .env exists for Secrets plugin
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Compute Next Version
        id: next_version
        run: |
          chmod +x scripts/next_version.sh
          ./scripts/next_version.sh

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          VERSION="${{ steps.next_version.outputs.version }}"
          CODE="${{ steps.next_version.outputs.code }}"
          echo "Building ExamPrep with appVersionName=$VERSION, appVersionCode=$CODE"
          ./gradlew assembleDebug -PappVersionName=$VERSION -PappVersionCode=$CODE --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPrep-${{ steps.next_version.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release Assets, Tag, and Changelog
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: release_info
        run: |
          VERSION="${{ steps.next_version.outputs.version }}"
          TAG="v$VERSION"

          # Fail if tag already exists on remote
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists! Aborting release step to prevent overwriting."
            exit 1
          fi

          # Prepare named APK artifact
          cp app/build/outputs/apk/debug/app-debug.apk "ExamPrep-$VERSION.apk"

          # Create and push git tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          # Capture commit message for release changelog
          COMMIT_MSG=$(git log -1 --pretty=format:"%s%n%n%b")
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.next_version.outputs.version }}
          name: ExamPrep ${{ steps.next_version.outputs.version }}
          body: ${{ steps.release_info.outputs.changelog }}
          files: ExamPrep-${{ steps.next_version.outputs.version }}.apk
          draft: false
          prerelease: false
